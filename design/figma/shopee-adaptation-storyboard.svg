<svg xmlns="http://www.w3.org/2000/svg" width="2860" height="1200" viewBox="0 0 2860 1200">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#202124}.h1{font:700 21px Arial,sans-serif;fill:#202124}.h2{font:700 16px Arial,sans-serif;fill:#202124}.body{font:14px Arial,sans-serif;fill:#333}.small{font:12px Arial,sans-serif;fill:#6B7280}.tiny{font:10px Arial,sans-serif;fill:#6B7280}.orange{fill:#EE4D2D}.orangeText{fill:#EE4D2D}.card{fill:#fff;stroke:#E5E7EB}.phone{fill:#fff;stroke:#202124;stroke-width:4}.soft{fill:#FFF5F1}.gray{fill:#F4F5F6}.chip{fill:#FFF3EF;stroke:#F2B6A7}.good{fill:#15803D}.line{stroke:#E5E7EB}.sample{font:700 9px Arial,sans-serif;fill:#9CA3AF;letter-spacing:.6px}
    </style>
    <symbol id="search" viewBox="0 0 20 20"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#6B7280" stroke-width="1.7"/><path d="M12 12l5 5" stroke="#6B7280" stroke-width="1.7"/></symbol>
    <symbol id="bag" viewBox="0 0 80 80"><path d="M18 28h44l-4 40H22z" fill="#FFF" stroke="#EE4D2D" stroke-width="4"/><path d="M29 30c0-20 22-20 22 0" fill="none" stroke="#EE4D2D" stroke-width="4"/><path d="M33 46c6 7 10 7 15 0" fill="none" stroke="#EE4D2D" stroke-width="3"/></symbol>
    <symbol id="product" viewBox="0 0 100 80"><rect x="15" y="12" width="70" height="55" rx="10" fill="#E5E7EB"/><circle cx="50" cy="39" r="18" fill="#D1D5DB"/><rect x="42" y="18" width="16" height="42" rx="8" fill="#B7BBC2"/></symbol>
    <symbol id="bottom" viewBox="0 0 390 58"><rect width="390" height="58" fill="#fff" stroke="#E5E7EB"/><text x="28" y="35" class="small orangeText">หน้าแรก</text><text x="104" y="35" class="small">ค้นหา</text><text x="180" y="35" class="small">ฟีด</text><text x="250" y="35" class="small">ตะกร้า</text><text x="335" y="35" class="small">ฉัน</text></symbol>
  </defs>
  <rect width="2860" height="1200" fill="#F3F4F6"/>
  <text x="60" y="55" class="title">Shopee adaptive journey — familiar first, personalized over time</text>
  <text x="60" y="82" class="body">Baseline → optional interview → explicit first change → gradual learning → mature, reversible experience</text>

  <!-- arrows -->
  <g fill="none" stroke="#EE4D2D" stroke-width="3"><path d="M480 516h70"/><path d="M1030 516h70"/><path d="M1580 516h70"/><path d="M2130 516h70"/></g>
  <g fill="#EE4D2D"><path d="M550 516l-12-7v14z"/><path d="M1100 516l-12-7v14z"/><path d="M1650 516l-12-7v14z"/><path d="M2200 516l-12-7v14z"/></g>

  <!-- baseline -->
  <g transform="translate(60 120)">
    <text x="0" y="-20" class="h1">1 · Standard Shopee</text><text x="0" y="0" class="small">No personalization before user action</text>
    <rect width="420" height="820" rx="28" class="phone"/>
    <rect x="2" y="2" width="416" height="118" rx="26" class="orange"/>
    <use href="#bag" x="16" y="14" width="45" height="45"/><text x="67" y="43" style="font:700 19px Arial;fill:#fff">Shopee</text>
    <rect x="16" y="64" width="330" height="40" rx="7" fill="#fff"/><use href="#search" x="28" y="74" width="20" height="20"/><text x="55" y="89" class="small">ค้นหาสินค้าและร้านค้า</text><text x="360" y="89" style="font:18px Arial;fill:#fff">🛒</text>
    <text x="16" y="150" class="h2">หมวดหมู่</text>
    <g transform="translate(16 164)"><rect width="388" height="88" rx="10" class="card"/><g class="small"><text x="19" y="55">แฟชั่น</text><text x="94" y="55">บิวตี้</text><text x="166" y="55">ไอที</text><text x="230" y="55">บ้าน</text><text x="300" y="55">อาหาร</text></g><g fill="#FFF3EF" stroke="#EE4D2D"><circle cx="36" cy="25" r="17"/><circle cx="108" cy="25" r="17"/><circle cx="177" cy="25" r="17"/><circle cx="241" cy="25" r="17"/><circle cx="315" cy="25" r="17"/></g></g>
    <rect x="16" y="270" width="388" height="112" rx="12" class="orange"/><text x="32" y="305" style="font:700 22px Arial;fill:#fff">ดีลประจำวัน</text><text x="32" y="335" style="font:14px Arial;fill:#fff">พื้นที่แคมเปญมาตรฐานของ Shopee</text><rect x="32" y="347" width="110" height="26" rx="6" fill="#fff"/><text x="54" y="365" class="small orangeText">ดูสินค้า</text>
    <rect x="16" y="398" width="388" height="98" rx="10" class="soft" stroke="#F1B6A7"/><text x="30" y="427" class="h2 orangeText">อยากให้ Shopee เหมาะกับคุณขึ้นไหม?</text><text x="30" y="452" class="small">ตอบคำถามสั้น ๆ หรือข้ามไปก่อนก็ได้</text><rect x="30" y="463" width="130" height="25" rx="6" class="orange"/><text x="51" y="480" style="font:700 11px Arial;fill:#fff">เริ่มตั้งค่า</text><text x="320" y="480" class="tiny">ไว้ทีหลัง</text>
    <text x="16" y="528" class="h2">สินค้าแนะนำประจำวัน</text>
    <g transform="translate(16 544)"><rect width="186" height="178" rx="10" class="card"/><rect width="186" height="98" rx="10" class="gray"/><use href="#product" x="43" y="8" width="100" height="80"/><text x="10" y="93" class="sample">CATALOG</text><text x="12" y="123" class="body">สินค้าแนะนำ</text><text x="12" y="148" class="h2 orangeText">฿—</text><text x="12" y="167" class="tiny">ข้อมูลจากแคตตาล็อก</text></g>
    <g transform="translate(218 544)"><rect width="186" height="178" rx="10" class="card"/><rect width="186" height="98" rx="10" class="gray"/><use href="#product" x="43" y="8" width="100" height="80"/><text x="10" y="93" class="sample">CATALOG</text><text x="12" y="123" class="body">สินค้าแนะนำ</text><text x="12" y="148" class="h2 orangeText">฿—</text><text x="12" y="167" class="tiny">ข้อมูลจากแคตตาล็อก</text></g>
    <use href="#bottom" x="15" y="760" width="390" height="58"/>
  </g>

  <!-- interview -->
  <g transform="translate(610 120)">
    <text x="0" y="-20" class="h1">2 · Optional interview</text><text x="0" y="0" class="small">Explicit answers create confirmed preferences</text>
    <rect width="420" height="820" rx="28" class="phone"/><rect x="2" y="2" width="416" height="820" rx="26" fill="#000" opacity=".18"/>
    <rect x="12" y="178" width="396" height="642" rx="24" fill="#fff"/>
    <rect x="176" y="191" width="68" height="5" rx="3" fill="#D1D5DB"/>
    <text x="28" y="236" class="small orangeText">คำถาม 1 จาก 5</text><text x="28" y="276" class="h1">ปกติคุณอยากให้ Shopee</text><text x="28" y="304" class="h1">ช่วยเรื่องไหนมากที่สุด?</text>
    <g transform="translate(28 334)"><rect width="364" height="62" rx="10" class="chip"/><text x="18" y="27" class="h2 orangeText">เปรียบเทียบก่อนเลือก</text><text x="18" y="47" class="small">Show me differences clearly</text></g>
    <g transform="translate(28 410)"><rect width="364" height="62" rx="10" class="card"/><text x="18" y="27" class="h2">ค้นพบสิ่งใหม่</text><text x="18" y="47" class="small">Help me explore visually</text></g>
    <g transform="translate(28 486)"><rect width="364" height="62" rx="10" class="card"/><text x="18" y="27" class="h2">ซื้อของเดิมให้เร็วขึ้น</text><text x="18" y="47" class="small">Repeat and reorder</text></g>
    <g transform="translate(28 562)"><rect width="364" height="62" rx="10" class="card"/><text x="18" y="27" class="h2">ซื้อให้คนอื่น</text><text x="18" y="47" class="small">Simple choices and sharing</text></g>
    <text x="28" y="668" class="small">ทุกคำถามข้ามได้ · เปลี่ยนภายหลังได้</text>
    <rect x="28" y="700" width="236" height="48" rx="9" class="orange"/><text x="117" y="730" style="font:700 15px Arial;fill:#fff">ถัดไป</text><text x="327" y="730" class="small">ข้าม</text>
    <rect x="28" y="770" width="364" height="6" rx="3" fill="#E5E7EB"/><rect x="28" y="770" width="72" height="6" rx="3" class="orange"/>
  </g>

  <!-- seeded -->
  <g transform="translate(1160 120)">
    <text x="0" y="-20" class="h1">3 · First adaptation</text><text x="0" y="0" class="small">Preview, explain, apply, Undo</text>
    <rect width="420" height="820" rx="28" class="phone"/>
    <rect x="2" y="2" width="416" height="116" rx="26" class="orange"/><text x="18" y="35" style="font:700 19px Arial;fill:#fff">Shopee <tspan style="font:12px Arial">COMPARE MODE</tspan></text><rect x="16" y="55" width="388" height="42" rx="7" fill="#fff"/><text x="32" y="81" class="small">ค้นหาสินค้าที่ต้องการเทียบ</text>
    <rect x="16" y="136" width="388" height="136" rx="12" fill="#fff" stroke="#D1D5DB"/><text x="30" y="162" class="small">WHAT CHANGED</text><text x="30" y="190" class="body">• ตารางเปรียบเทียบขึ้นก่อน</text><text x="30" y="215" class="body">• การ์ดสินค้าแสดงสเปกก่อน</text><text x="30" y="240" class="body">• ลดส่วนโปรโมชันที่ไม่เกี่ยวข้อง</text><text x="30" y="260" class="small orangeText">Undo</text><text x="330" y="260" class="small">Reset</text>
    <g transform="translate(16 289)"><rect width="112" height="28" rx="14" class="chip"/><text x="18" y="18" class="small orangeText">เปรียบเทียบ</text></g><g transform="translate(138 289)"><rect width="126" height="28" rx="14" class="chip"/><text x="18" y="18" class="small orangeText">ข้อมูลละเอียด</text></g>
    <text x="16" y="352" class="h2">เลือกสินค้าเพื่อเปรียบเทียบ</text>
    <g transform="translate(16 370)"><rect width="388" height="196" rx="10" class="card"/><rect x="0" y="0" width="116" height="196" class="gray"/><text x="16" y="42" class="small">คุณสมบัติ</text><text x="16" y="91" class="small">สเปกหลัก</text><text x="16" y="136" class="small">ประกัน</text><text x="16" y="179" class="small">ส่งถึง</text><path d="M116 64h272M116 111h272M116 156h272" class="line"/><text x="142" y="42" class="body">สินค้า A</text><text x="240" y="42" class="body">สินค้า B</text><text x="334" y="42" class="body">สินค้า C</text><text x="142" y="91" class="small">catalog</text><text x="240" y="91" class="small">catalog</text><text x="334" y="91" class="small">catalog</text><text x="142" y="136" class="small">listing</text><text x="240" y="136" class="small">listing</text><text x="334" y="136" class="small">listing</text><text x="142" y="179" class="small">logistics</text><text x="240" y="179" class="small">logistics</text><text x="334" y="179" class="small">logistics</text></g>
    <rect x="16" y="585" width="388" height="105" rx="10" class="soft"/><text x="30" y="612" class="h2">ทำไมลำดับนี้?</text><text x="30" y="638" class="small">เหตุผลจากตรรกะการจัดอันดับเดียวกันกับสินค้า</text><rect x="30" y="653" width="310" height="10" rx="5" fill="#202124"/><rect x="30" y="671" width="230" height="10" rx="5" fill="#202124"/>
    <rect x="16" y="708" width="388" height="42" rx="8" class="gray"/><text x="80" y="734" class="small good">✓ ข้อมูลสินค้าไม่เปลี่ยนจากหน้ามาตรฐาน</text>
    <use href="#bottom" x="15" y="760" width="390" height="58"/>
  </g>

  <!-- learning -->
  <g transform="translate(1710 120)">
    <text x="0" y="-20" class="h1">4 · Learning over time</text><text x="0" y="0" class="small">Repeated evidence, one low-risk change at a time</text>
    <rect width="420" height="820" rx="28" class="phone"/>
    <rect x="2" y="2" width="416" height="116" rx="26" class="orange"/><text x="18" y="35" style="font:700 19px Arial;fill:#fff">Shopee</text><rect x="16" y="55" width="388" height="42" rx="7" fill="#fff"/><text x="32" y="81" class="small">ค้นหาสินค้าและร้านค้า</text>
    <rect x="16" y="136" width="388" height="112" rx="12" class="soft" stroke="#F1B6A7"/><text x="30" y="163" class="small orangeText">SUGGESTED FROM REPEATED USE</text><text x="30" y="192" class="h2">คุณเปิดตารางเปรียบเทียบบ่อย</text><text x="30" y="215" class="small">ให้แสดงปุ่มเปรียบเทียบก่อนดีไหม?</text><rect x="30" y="226" width="126" height="28" rx="7" class="orange"/><text x="50" y="245" style="font:700 11px Arial;fill:#fff">ใช้การเปลี่ยนนี้</text><text x="331" y="245" class="tiny">ไม่ใช้</text>
    <text x="16" y="282" class="h2">ซื้อซ้ำได้เร็วขึ้น</text>
    <g transform="translate(16 298)"><rect width="388" height="108" rx="10" class="card"/><rect width="108" height="108" rx="10" class="gray"/><use href="#product" x="4" y="14" width="100" height="80"/><text x="124" y="31" class="h2">สินค้าที่ซื้อเป็นประจำ</text><text x="124" y="58" class="small">จากประวัติคำสั่งซื้อของคุณ</text><rect x="124" y="71" width="118" height="28" rx="7" fill="#fff" stroke="#EE4D2D"/><text x="148" y="90" class="small orangeText">ซื้ออีกครั้ง</text></g>
    <text x="16" y="443" class="h2">สำหรับงานที่กำลังทำ</text>
    <g transform="translate(16 459)"><rect width="186" height="188" rx="10" class="card"/><rect width="186" height="100" rx="10" class="gray"/><use href="#product" x="43" y="10" width="100" height="80"/><text x="12" y="129" class="body">สินค้าที่เกี่ยวข้อง</text><text x="12" y="153" class="h2 orangeText">฿—</text><text x="12" y="174" class="tiny">เหตุผล: งานปัจจุบัน</text></g><g transform="translate(218 459)"><rect width="186" height="188" rx="10" class="card"/><rect width="186" height="100" rx="10" class="gray"/><use href="#product" x="43" y="10" width="100" height="80"/><text x="12" y="129" class="body">สิ่งใหม่ให้สำรวจ</text><text x="12" y="153" class="h2 orangeText">฿—</text><text x="12" y="174" class="tiny">Discovery lane</text></g>
    <rect x="16" y="668" width="388" height="72" rx="10" class="card"/><text x="30" y="695" class="small">CHANGED FOR YOU</text><text x="30" y="718" class="body">ซื้อซ้ำขึ้นก่อน · เพราะใช้หลายครั้ง</text><text x="351" y="718" class="small orangeText">ดู</text>
    <use href="#bottom" x="15" y="760" width="390" height="58"/>
  </g>

  <!-- mature -->
  <g transform="translate(2260 120)">
    <text x="0" y="-20" class="h1">5 · Mature but reversible</text><text x="0" y="0" class="small">Confirmed + stable preferences, fully inspectable</text>
    <rect width="420" height="820" rx="28" class="phone"/>
    <rect x="2" y="2" width="416" height="116" rx="26" class="orange"/><text x="18" y="35" style="font:700 19px Arial;fill:#fff">Shopee <tspan style="font:12px Arial">YOUR STORE</tspan></text><rect x="16" y="55" width="388" height="42" rx="7" fill="#fff"/><text x="32" y="81" class="small">ค้นหาในร้านที่ปรับให้คุณ</text>
    <g transform="translate(16 136)"><rect width="112" height="28" rx="14" class="chip"/><text x="17" y="18" class="small orangeText">คุ้มค่าก่อน</text></g><g transform="translate(138 136)"><rect width="128" height="28" rx="14" class="chip"/><text x="18" y="18" class="small orangeText">เทียบละเอียด</text></g><text x="335" y="154" class="small">แก้ไข</text>
    <rect x="16" y="182" width="388" height="90" rx="10" class="card"/><text x="30" y="209" class="small">YOUR PREFERENCES</text><text x="30" y="235" class="body">ยืนยันเอง: คุ้มค่า · รายละเอียด</text><text x="30" y="258" class="body">เรียนรู้: ซื้อซ้ำขึ้นก่อน</text><text x="350" y="258" class="small orangeText">ดู</text>
    <text x="16" y="307" class="h2">กลับมาซื้ออีกครั้ง</text>
    <rect x="16" y="323" width="388" height="88" rx="10" class="soft"/><text x="30" y="351" class="h2">ของใช้ประจำ</text><text x="30" y="378" class="small">จัดจากประวัติคำสั่งซื้อ ไม่ใช่ AI เดา</text><rect x="290" y="341" width="96" height="34" rx="7" class="orange"/><text x="313" y="363" style="font:700 11px Arial;fill:#fff">ดูรายการ</text>
    <text x="16" y="447" class="h2">เปรียบเทียบก่อนเลือก</text>
    <g transform="translate(16 463)"><rect width="388" height="158" rx="10" class="card"/><text x="18" y="28" class="small">สินค้า</text><text x="150" y="28" class="small">เหมาะกับคุณเพราะ</text><path d="M18 42h350M18 88h350M18 130h350" class="line"/><text x="18" y="70" class="body">Product A</text><text x="150" y="70" class="small">คุ้มค่า · ส่งไว</text><text x="18" y="116" class="body">Product B</text><text x="150" y="116" class="small">คุณภาพ · ประกัน</text><text x="18" y="150" class="body">Product C</text><text x="150" y="150" class="small">ตัวเลือกใหม่</text></g>
    <rect x="16" y="641" width="388" height="98" rx="10" fill="#fff" stroke="#202124"/><text x="30" y="667" class="small">WHY THIS STORE?</text><text x="30" y="692" class="body">คุณเลือก 2 อย่าง · ระบบเรียนรู้ 1 อย่าง</text><text x="30" y="718" class="small orangeText">What changed</text><text x="152" y="718" class="small">Undo</text><text x="329" y="718" class="small">Reset</text>
    <use href="#bottom" x="15" y="760" width="390" height="58"/>
  </g>

  <g transform="translate(60 990)">
    <rect width="2620" height="150" rx="16" fill="#fff" stroke="#D1D5DB"/>
    <text x="24" y="36" class="h1">Adaptation contract</text>
    <text x="24" y="72" class="body">Explicit choice beats inference</text><text x="24" y="100" class="small">Interview answers and direct controls always win.</text>
    <text x="560" y="72" class="body">One low-risk change at a time</text><text x="560" y="100" class="small">Repeated behaviour may suggest; it does not silently rebuild.</text>
    <text x="1210" y="72" class="body">Facts never adapt</text><text x="1210" y="100" class="small">Price, specs, ratings, shipping, vouchers remain catalog-owned.</text>
    <text x="1815" y="72" class="body">Visible and reversible</text><text x="1815" y="100" class="small">What changed · evidence · Undo · Reset.</text>
  </g>
</svg>
