0e10\u0e32\u0e19\n\n### 2.1 \u0e01\u0e23\u0e30\u0e1a\u0e27\u0e19\u0e01\u0e32\u0e23\n\n**\u0e01\u0e32\u0e23\u0e04\u0e49\u0e19\u0e04\u0e27\u0e49\u0e32 4 \u0e23\u0e2d\u0e1a** \u0e41\u0e15\u0e48\u0e25\u0e30\u0e23\u0e2d\u0e1a\u0e43\u0e0a\u0e49\u0e1c\u0e39\u0e49\u0e0a\u0e48\u0e27\u0e22\u0e27\u0e34\u0e08\u0e31\u0e22\u0e41\u0e22\u0e01\u0e15\u0e32\u0e21\u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d\u0e17\u0e33\u0e07\u0e32\u0e19\u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e01\u0e31\u0e19 \u0e41\u0e25\u0e49\u0e27\u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01\u0e25\u0e07\u0e44\u0e1f\u0e25\u0e4c (\u0e42\u0e04\u0e23\u0e07\u0e2a\u0e23\u0e49\u0e32\u0e07: Takeaway / Cited Findings / Inferences / Gaps):\n\n| \u0e23\u0e2d\u0e1a | \u0e2b\u0e31\u0e27\u0e02\u0e49\u0e2d | \u0e1a\u0e31\u0e19\u0e17\u0e36\u0e01 |\n|---|---|---|\n| 1 | \u0e1c\u0e25\u0e02\u0e2d\u0e07 personalization, \u0e01\u0e25\u0e44\u0e01\u0e02\u0e2d\u0e07\u0e41\u0e1e\u0e25\u0e15\u0e1f\u0e2d\u0e23\u0e4c\u0e21\u0e43\u0e19 SEA, \u0e40\u0e17\u0e04\u0e19\u0e34\u0e04 recsys, dark patterns | [`research/notes-cross-sell/`](research/notes-cross-sell/) + [`research/cross-sell-tactics-report.md`](research/cross-sell-tactics-report.md) |\n| 2 | \u0e02\u0e19\u0e32\u0e14\u0e1c\u0e25\u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e04\u0e48\u0e32\u0e2a\u0e16\u0e34\u0e15\u0e34, \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e15\u0e25\u0e32\u0e14\u0e44\u0e17\u0e22, \u0e27\u0e34\u0e18\u0e35\u0e2d\u0e2d\u0e01\u0e41\u0e1a\u0e1a\u0e01\u0e32\u0e23\u0e17\u0e14\u0e25\u0e2d\u0e07 | [`research/notes-quant-context/`](research/notes-quant-context/) `effect_sizes`, `market_baselines`, `experiment_methods` |\n| 3 | Persona \u0e44\u0e17\u0e22, \u0e04\u0e27\u0e32\u0e21\u0e40\u0e1b\u0e47\u0e19\u0e44\u0e1b\u0e44\u0e14\u0e49\u0e17\u0e32\u0e07\u0e40\u0e17\u0e04\u0e19\u0e34\u0e04\u0e41\u0e25\u0e30\u0e04\u0e27\u0e32\u0e21\u0e19\u0e48\u0e32\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e16\u0e37\u0e2d | `thai_personas`, `feasibility_credibility` |\n| 4 | \u0e1a\u0e23\u0e34\u0e1a\u0e17\u0e41\u0e25\u0e30 moment, \u0e40\u0e28\u0e23\u0e29\u0e10\u0e28\u0e32\u0e2a\u0e15\u0e23\u0e4c\u0e04\u0e39\u0e1b\u0e2d\u0e07 | `context_moments`, `coupon_economics` |\n\n**\u0e1f\u0e35\u0e14\u0e41\u0e1a\u0e47\u0e01\u0e08\u0e32\u0e01\u0e20\u0e32\u0e22\u0e19\u0e2d\u0e01:** \u0e44\u0e1f\u0e25\u0e4c\u0e40\u0e2a\u0e35\u0e22\u0e07\u0e23\u0e35\u0e27\u0e34\u0e27 9.7 \u0e19\u0e32\u0e17\u0e35 \u0e16\u0e2d\u0e14\u0e40\u0e2a\u0e35\u0e22\u0e07\u0e43\u0e19\u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e14\u0e49\u0e27\u0e22 whisper.cpp (large-v3-turbo) \u0e44\u0e14\u0e49 3 \u0e1b\u0e23\u0e30\u0e40\u0e14\u0e47\u0e19: (1) \u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e04\u0e27\u0e32\u0e21\u0e44\u0e21\u0e48\u0e41\u0e19\u0e48\u0e19\u0e2d\u0e19\u0e43\u0e2b\u0e49\u0e40\u0e1b\u0e47\u0e19 innovation gap, (2) \u0e22\u0e49\u0e32\u0e22\u0e1a\u0e31\u0e0d\u0e0a\u0e35\u0e04\u0e33\u0e01\u0e25\u0e48\u0e32\u0e27\u0e2d\u0e49\u0e32\u0e07\u0e02\u0e36\u0e49\u0e19\u0e21\u0e32\u0e40\u0e1b\u0e34\u0e14 pitch, (3) \u0e17\u0e33\u0e1a\u0e31\u0e19\u0e44\u0e14\u0e02\u0e22\u0e32\u0e22\u0e1c\u0e25\n\n### 2.2 \u0e40\u0e01\u0e23\u0e14\u0e2b\u0e25\u0e31\u0e01\u0e10\u0e32\u0e19 (\u0e43\u0e0a\u0e49\u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e01\u0e31\u0e19\u0e17\u0e38\u0e01\u0e40\u0e2d\u0e01\u0e2a\u0e32\u0e23)\n\n| \u0e40\u0e01\u0e23\u0e14 | \u0e19\u0e34\u0e22\u0e32\u0e21 | \u0e43\u0e0a\u0e49\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e44\u0e23 |\n|---|---|---|\n| **A** | \u0e01\u0e32\u0e23\u0e17\u0e14\u0e25\u0e2d\u0e07\u0e20\u0e32\u0e04\u0e2a\u0e19\u0e32\u0e21\u0e41\u0e1a\u0e1a\u0e2a\u0e38\u0e48\u0e21 (RCT) \u0e17\u0e35\u0e48\u0e15\u0e23\u0e27\u0e08\u0e04\u0e48\u0e32 SE \u0e2b\u0e23\u0e37\u0e2d p-value \u0e08\u0e32\u0e01\u0e09\u0e1a\u0e31\u0e1a\u0e40\u0e15\u0e47\u0e21\u0e41\u0e25\u0e49\u0e27 | \u0e43\u0e0a\u0e49\u0e40\u0e1b\u0e47\u0e19\u0e2b\u0e25\u0e31\u0e01\u0e10\u0e32\u0e19\u0e2b\u0e25\u0e31\u0e01\u0e44\u0e14\u0e49 |\n| **A\u2212** | \u0e40\u0e1b\u0e47\u0e19 RCT \u0e41\u0e15\u0e48\u0e15\u0e31\u0e27\u0e40\u0e25\u0e02\u0e21\u0e32\u0e08\u0e32\u0e01 abstract \u0e2b\u0e23\u0e37\u0e2d\u0e1a\u0e17\u0e2a\u0e23\u0e38\u0e1b | \u0e43\u0e0a\u0e49\u0e44\u0e14\u0e49 \u0e41\u0e15\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e23\u0e30\u0e1a\u0e38\u0e27\u0e48\u0e32\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49\u0e15\u0e23\u0e27\u0e08\u0e09\u0e1a\u0e31\u0e1a\u0e40\u0e15\u0e47\u0e21 |\n| **B** | A/B test \u0e43\u0e19\u0e2d\u0e38\u0e15\u0e2a\u0e32\u0e2b\u0e01\u0e23\u0e23\u0e21\u0e17\u0e35\u0e48\u0e44\u0e21\u0e48\u0e23\u0e32\u0e22\u0e07\u0e32\u0e19\u0e2a\u0e16\u0e34\u0e15\u0e34, \u0e1c\u0e25\u0e08\u0e32\u0e01\u0e42\u0e21\u0e40\u0e14\u0e25\u0e40\u0e0a\u0e34\u0e07\u0e42\u0e04\u0e23\u0e07\u0e2a\u0e23\u0e49\u0e32\u0e07, \u0e2b\u0e23\u0e37\u0e2d\u0e07\u0e32\u0e19\u0e17\u0e35\u0e48\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e1c\u0e48\u0e32\u0e19 peer review | \u0e43\u0e0a\u0e49\u0e40\u0e1b\u0e47\u0e19\u0e2b\u0e25\u0e31\u0e01\u0e10\u0e32\u0e19\u0e1b\u0e23\u0e30\u0e01\u0e2d\u0e1a |\n| **C** | \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e40\u0e0a\u0e34\u0e07\u0e2a\u0e31\u0e07\u0e40\u0e01\u0e15 \u0e41\u0e1a\u0e1a\u0e2a\u0e33\u0e23\u0e27\u0e08 \u0e1a\u0e23\u0e34\u0e29\u0e31\u0e17\u0e17\u0e35\u0e48\u0e1b\u0e23\u0e36\u0e01\u0e29\u0e32 \u0e2b\u0e23\u0e37\u0e2d\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e23\u0e31\u0e10 | \u0e43\u0e0a\u0e49\u0e40\u0e1b\u0e47\u0e19\u0e1a\u0e23\u0e34\u0e1a\u0e17 \u0e2b\u0e49\u0e32\u0e21\u0e2d\u0e49\u0e32\u0e07\u0e27\u0e48\u0e32\u0e40\u0e1b\u0e47\u0e19\u0e1c\u0e25\u0e40\u0e0a\u0e34\u0e07\u0e40\u0e2b\u0e15\u0e38 |\n| **D** | \u0e1a\u0e23\u0e34\u0e29\u0e31\u0e17\u0e1b\u0e23\u0e30\u0e01\u0e32\u0e28\u0e40\u0e2d\u0e07, vendor, \u0e2b\u0e23\u0e37\u0e2d\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49 | \u0e43\u0e0a\u0e49\u0e44\u0e14\u0e49\u0e41\u0e04\u0e48\u0e40\u0e1b\u0e47\u0e19\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13 \u0e2b\u0e49\u0e32\u0e21\u0e43\u0e0a\u0e49\u0e40\u0e1b\u0e47\u0e19\u0e15\u0e31\u0e27\u0e40\u0e25\u0e02\u0e2b\u0e25\u0e31\u0e01\u0e1a\u0e19\u0e40\u0e27\u0e17\u0e35 |\n| **[\u0e2a\u0e21\u0e21\u0e15\u0e34\u0e10\u0e32\u0e19]** | \u0e04\u0e48\u0e32\u0e17\u0e35\u0e48\u0e17\u0e35\u0e21\u0e15\u0e31\u0e49\u0e07\u0e40\u0e2d\u0e07 | \u0e15\u0e49\u0e2d\u0e07\u0e2d\u0e22\u0e39\u0e48\u0e43\u0e19\u0e2a\u0e04\u0e23\u0e34\u0e1b\u0e15\u0e4c\u0e41\u0e25\u0e30\u0e21\u0e35\u0e41\u0e1c\u0e19\u0e17\u0e14\u0e2a\u0e2d\u0e1a |\n\n### 2.3 \u0e01\u0e32\u0e23\u0e04\u0e33\u0e19\u0e27\u0e13 SE \u0e22\u0e49\u0e2d\u0e19\u0e01\u0e25\u0e31\u0e1a\n\n\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e07\u0e32\u0e19\u0e27\u0e34\u0e08\u0e31\u0e22\u0e23\u0e32\u0e22\u0e07\u0e32\u0e19\u0e2a\u0e31\u0e21\u0e1b\u0e23\u0e30\u0e2a\u0e34\u0e17\u0e18\u0e34\u0e4c $\\hat b$, SE \u0e41\u0e25\u0e30\u0e02\u0e19\u0e32\u0e14\u0e1c\u0e25\u0e41\u0e1a\u0e1a\u0e2a\u0e31\u0e21\u0e1e\u0e31\u0e17\u0e18\u0e4c $y$ \u0e40\u0e23\u0e32\u0e04\u0e07\u0e04\u0e48\u0e32 t-statistic \u0e44\u0e27\u0e49:\n\n$$\nt = \\hat b / SE(\\hat b),\\qquad SE_{rel} = y / t,\\qquad 95\\%\\ CI = y \\pm 1.96\\,SE_{rel},\\qquad p = 2(1-\\Phi(|t|))\n$$\n\n\u0e16\u0e49\u0e32\u0e21\u0e35\u0e41\u0e04\u0e48 p-value \u0e43\u0e0a\u0e49 $|t| = \\Phi^{-1}(1-p/2)$ (\u0e40\u0e0a\u0e48\u0e19 Shehu: p = .083 \u2192 t = 1.73)\n\n---\n\n## 3. \u0e19\u0e34\u0e22\u0e32\u0e21\u0e15\u0e31\u0e27\u0e0a\u0e35\u0e49\u0e27\u0e31\u0e14\u0e41\u0e25\u0e30\u0e41\u0e1c\u0e19\u0e40\u0e01\u0e47\u0e1a\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\n\n### 3.1 \u0e15\u0e31\u0e27\u0e0a\u0e35\u0e49\u0e27\u0e31\u0e14\n\n| \u0e15\u0e31\u0e27\u0e0a\u0e35\u0e49\u0e27\u0e31\u0e14 | \u0e19\u0e34\u0e22\u0e32\u0e21 | \u0e2b\u0e19\u0e48\u0e27\u0e22\u0e27\u0e34\u0e40\u0e04\u0e23\u0e32\u0e30\u0e2b\u0e4c |\n|---|---|---|\n| **RPS** (north star) | \u0e23\u0e32\u0e22\u0e44\u0e14\u0e49\u0e23\u0e27\u0e21 \u00f7 \u0e08\u0e33\u0e19\u0e27\u0e19 session = CR \u00d7 AOV | session (\u0e15\u0e31\u0e27\u0e0a\u0e35\u0e49\u0e27\u0e31\u0e14\u0e41\u0e1a\u0e1a\u0e2d\u0e31\u0e15\u0e23\u0e32\u0e2a\u0e48\u0e27\u0e19 \u2192 \u0e43\u0e0a\u0e49 delta method) |\n| CR | session \u0e17\u0e35\u0e48\u0e21\u0e35\u0e01\u0e32\u0e23\u0e0b\u0e37\u0e49\u0e2d \u00f7 session \u0e17\u0e31\u0e .0 pp) \u0e15\u0e23\u0e07\u0e01\u0e31\u0e1a\u0e17\u0e35\u0e48\u0e07\u0e32\u0e19\u0e27\u0e34\u0e08\u0e31\u0e22\u0e23\u0e32\u0e22\u0e07\u0e32\u0e19 +16.3%\n- **\u0e2a\u0e21\u0e21\u0e15\u0e34\u0e10\u0e32\u0e19:** \u0e2a\u0e39\u0e15\u0e23\u0e19\u0e35\u0e49\u0e16\u0e39\u0e01\u0e15\u0e49\u0e2d\u0e07\u0e40\u0e2a\u0e21\u0e2d\u0e42\u0e14\u0e22\u0e19\u0e34\u0e22\u0e32\u0e21 \u0e41\u0e15\u0e48\u0e01\u0e32\u0e23\u0e2b\u0e32 SE \u0e14\u0e49\u0e27\u0e22 delta method \u0e2a\u0e21\u0e21\u0e15\u0e34\u0e27\u0e48\u0e32\u0e2a\u0e48\u0e27\u0e19\u0e1b\u0e23\u0e30\u0e01\u0e2d\u0e1a\u0e40\u0e1b\u0e47\u0e19\u0e2d\u0e34\u0e2a\u0e23\u0e30\u0e15\u0e48\u0e2d\u0e01\u0e31\u0e19 \u0e16\u0e49\u0e32\u0e2a\u0e31\u0e21\u0e1e\u0e31\u0e19\u0e18\u0e4c\u0e01\u0e31\u0e19\u0e43\u0e19\u0e17\u0e32\u0e07\u0e1a\u0e27\u0e01 SE \u0e08\u0e23\u0e34\u0e07\u0e08\u0e30\u0e01\u0e27\u0e49\u0e32\u0e07\u0e01\u0e27\u0e48\u0e32\u0e19\u0e35\u0e49\n\n### 4.2 Meta-analysis \u0e41\u0e1a\u0e1a Random-effects (DerSimonian\u2013Laird)\n\n$$\nw_i=\\frac{1}{v_i},\\quad Q=\\sum w_i(y_i-\\hat\\mu_{FE})^2,\\quad \\hat\\tau^2=\\max\\!\\Big(0,\\frac{Q-(k-1)}{\\sum w_i-\\sum w_i^2/\\sum w_i}\\Big),\\quad \\hat\\mu_{RE}=\\frac{\\sum y_i/(v_i+\\hat\\tau^2)}{\\sum 1/(v_i+\\hat\\tau^2)}\n$$\n\n| \u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e17\u0e35\u0e48\u0e43\u0e0a\u0e49 | \u0e1c\u0e25 |\n|---|---|\n| L&H conversion +5.9% (SE 2.20), Fang chatbot +16.3% (5.77), Fang descriptions +2.1% (0.84), Fang search +2.9% (1.41) | Fixed-effect +2.85%; **Random-effects +4.02% (95% CI +1.14 \u0e16\u0e36\u0e07 +6.89)**; Q = 8.15 (df 3); \u03c4\u00b2 = 0.00047; **I\u00b2 = 63%**; \u0e0a\u0e48\u0e27\u0e07\u0e1e\u0e22\u0e32\u0e01\u0e23\u0e13\u0e4c 95% \u0e02\u0e2d\u0e07\u0e23\u0e30\u0e1a\u0e1a\u0e43\u0e2b\u0e21\u0e48 **\u22121.1% \u0e16\u0e36\u0e07 +9.2%** |\n\n**\u0e2a\u0e21\u0e21\u0e15\u0e34\u0e10\u0e32\u0e19:** \u0e07\u0e32\u0e19\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14\u0e27\u0e31\u0e14\u0e1c\u0e25\u0e41\u0e1a\u0e1a\u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0 (n)` | \u0e15\u0e32\u0e23\u0e32\u0e07\u0e1c\u0e25\u0e23\u0e27\u0e21\u0e2a\u0e30\u0e2a\u0e21 $\\sum_{i\\le n}\\ln i$ \u0e04\u0e33\u0e19\u0e27\u0e13\u0e04\u0e23\u0e31\u0e49\u0e07\u0e40\u0e14\u0e35\u0e22\u0e27 (n \u2264 100,000) \u0e43\u0e0a\u0e49\u0e41\u0e17\u0e19 lgamma \u0e02\u0e2d\u0e07\u0e08\u0e33\u0e19\u0e27\u0e19\u0e40\u0e15\u0e47\u0e21 |\n| `signTestTwoSided(k, n)` | binomial \u0e41\u0e1a\u0e1a exact \u0e40\u0e17\u0e35\u0e22\u0e1a\u0e01\u0e31\u0e1a 0.5 \u0e04\u0e33\u0e19\u0e27\u0e13\u0e43\u0e19 **log-space**: \u0e23\u0e27\u0e21\u0e17\u0e38\u0e01\u0e04\u0e48\u0e32 $\\log\\text{pmf}_i \\le \\log\\text{pmf}_k$ \u0e14\u0e49\u0e27\u0e22 log-sum-exp |\n| `probBBeatsA` | **closed form** (Evan Miller) \u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a posterior \u0e41\u0e1a\u0e1a Beta(1+s, 1+f): $\\sum_{i=0}^{\\alpha_B-1}\\exp\\!\\big(\\ln B(\\alpha_A+i,\\beta_A+\\beta_B)-\\ln(\\beta_B+i)-\\ln B(1+i,\\beta_B)-\\ln B(\\alpha_A,\\beta_A)\\big)$ \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e49 Monte Carlo |\n| `adjustedWald(x, n)` | $\\tilde p=(x+z^2/2)/(n+z^2)$, $\\tilde p\\pm z\\sqrt{\\tilde p(1-\\tilde p)/(n+z^2)}$ \u0e41\u0e25\u0e49\u0e27\u0e15\u0e31\u0e14\u0e04\u0e48\u0e32\u0e43\u0e2b\u0e49\u0e2d\u0e22\u0e39\u0e48\u0e43\u0e19 [0, 1] |\n| `ruleOfThreeExact(n)` | $1-0.05^{1/n}$ |\n| `nTwoProportions`, `nMean`, `cvRps`, `pairedMde` | \u0e2a\u0e39\u0e15\u0e23\u0e43\u0e19 \u00a77.3 \u0e43\u0e0a\u0e49\u0e04\u0e48\u0e32\u0e04\u0e07\u0e17\u0e35\u0e48 $z_{0.975}$ = **1.959963984540054** \u0e41\u0e25\u0e30 $z_{0.80}$ = **0.8416212335729143** (\u0e16\u0e49\u0e32\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e04\u0e48\u0e32\u0e2d\u0e37\u0e48\u0e19\u0e43\u0e0a\u0e49 Acklam inverse normal, \u0e04\u0e27\u0e32\u0e21\u0e04\u0e25\u0e32\u0e14\u0e40\u0e04\u0e25\u0e37\u0e48\u0e2d\u0e19\u0e2a\u0e31\u0e21\u0e1e\u0e31\u0e17\u0e18\u0e4c < 1.15e-9) |\n| `dersimonianLaird` | \u0e2a\u0e39\u0e15\u0e23\u0e43\u0e19 \u00a74.2 |\n\n**\u0e04\u0e48\u0e32\u0e2a\u0e38\u0e48\u0e21:**\n- **PRNG:** `mulberry32(seed)` 32-bit \u0e43\u0e2b\u0e49\u0e1c\u0e25\u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e40\u0e14\u0e34\u0e21\u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07 (default seed 20261121) \u0e41\u0e25\u0e30\u0e2b\u0e49\u0e32\u0e21\u0e43\u0e0a\u0e49 `Math.random()` \u0e43\u0e19 engine\n- **Beta:** \u0e2a\u0e23\u0e49\u0e32\u0e07\u0e08\u0e32\u0e01 Gamma \u0e14\u0e49\u0e27\u0e22 **Marsaglia\u2013Tsang** \u0e41\u0e25\u0e49\u0e27\u0e04\u0e33\u0e19\u0e27\u0e13 $X/(X+Y)$ \u0e16\u0e49\u0e32 shape < 1 \u0e43\u0e2b\u0e49\u0e43\u0e0a\u0e49\u0e40\u0e17\u0e04\u0e19\u0e34\u0e04 $U^{1/a}$ \u0e0a\u0e48\u0e27\u0e22\n- **Normal:** \u0e43\u0e0a\u0e49 Box\u2013Muller\n- **Monte Carlo:** \u0e15\u0e49\u0e2d\u0e07\u0e23\u0e32\u0e22\u0e07\u0e32\u0e19\u0e04\u0e27\u0e32\u0e21\u0e04\u0e25\u0e32\u0e14\u0e40\u0e04\u0e25\u0e37\u0e48\u0e2d\u0e19\u0e02\u0e2d\u0e07 Monte Carlo ($s/\\sqrt N$) \u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07; \u0e1a\u0e19 UI \u0e43\u0e2b\u0e49\u0e43\u0e0a\u0e49 closed form \u0e16\u0e49\u0e32\u0e21\u0e35 \u0e16\u0e49\u0e32\u0e44\u0e21\u0e48\u0e21\u0e35\u0e43\u0e2b\u0e49\u0e43\u0e0a\u0e49 N \u2264 20,000 \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e43\u0e2b\u0e49\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e44\u0e21\u0e48\u0e0a\u0e49\u0e32\n\n### 5.4 \u0e01\u0e32\u0e23\u0e2b\u0e32\u0e04\u0e48\u0e32\u0e17\u0e35\u0e48\u0e14\u0e35\u0e17\u0e35\u0e48\u0e2a\u0e38\u0e14 (Optimization)\n\n| \u0e17\u0e35\u0e48\u0e43\u0e0a\u0e49 | \u0e27\u0e34\u0e18\u0e35 | \u0e40\u0e2b\u0e15\u0e38\u0e1c\u0e25 |\n|---|---|---|\n| \u0e43\u0e19\u0e42\u0e1b\u0e23\u0e14\u0e31\u0e01\u0e15\u0e4c: \u0e40\u0e25\u0e37\u0e2d\u0e01\u0e23\u0e30\u0e14\u0e31\u0e1a\u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14 | **\u0e44\u0e25\u0e48\u0e04\u0e33\u0e19\u0e27\u0e13\u0e17\u0e38\u0e01\u0e23\u0e30\u0e14\u0e31\u0e1a** \u0e43\u0e19\u0e15\u0e32\u0e23\u0e32\u0e07\u0e17\u0e35\u0e48\u0e40\u0e1b\u0e34\u0e14\u0e40\u0e1c\u0e22 (0/10/20/30%) \u0e40\u0e09\u0e1e\u0e32\u0e30\u0e23\u0e30\u0e14\u0e31\u0e1a\u0e17\u0e35\u0e48 $d<m$ | \u0e21\u0e35\u0e41\u0e04\u0e48\u0e44\u0e21\u0e48\u0e01\u0e35\u0e48\u0e23\u0e30\u0e14\u0e31\u0e1a \u0e44\u0e14\u0e49\u0e04\u0e33\u0e15\u0e2d\u0e1a\u0e15\u0e23\u0e07\u0e40\u0e1b\u0e4a\u0e30 \u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e44\u0e14\u0e49 \u0e41\u0e25\u0e30\u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e01\u0e31\u0e19\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e17\u0e38\u0e01\u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e17\u0e35\u0e48\u0e40\u0e2b\u0e21\u0e37\u0e2d\u0e19\u0e01\u0e31\u0e19 |\n| \u0e43\u0e19\u0e07\u0e32\u0e19\u0e27\u0e34\u0e40\u0e04\u0e23\u0e32\u0e30\u0e2b\u0e4c: \u0e2a\u0e48\u0e27\u0e19\u0e25\u0e14\u0e17\u0e35\u0e48\u0e14\u0e35\u0e17\u0e35\u0e48\u0e2a\u0e38\u0e14\u0e41\u0e1a\u0e1a\u0e15\u0e48\u0e2d\u0e40\u0e19\u0e37\u0e48\u0e2d\u0e07 | **Golden-section search** \u0e1a\u0e19 $[0, m-10^{-6}]$ \u0e04\u0e27\u0e32\u0e21\u0e04\u0e25\u0e32\u0e14\u0e40\u0e04\u0e25\u0e37\u0e48\u0e2d\u0e19 1e-6 | \u0394\u03c0(d) \u0e40\u0e1b\u0e47\u0e19 unimodal \u0e43\u0e19\u0e0a\u0e48\u0e27\u0e07\u0e19\u0e35\u0e49 |\n| \u0e15\u0e23\u0e27\u0e08\u0e04\u0e33\u0e15\u0e2d\u0e1a | fixed point $d^*=m-1/[\\beta(1-p_{d^*})]$ \u0e43\u0e0a\u0e49 damping 0.5 \u0e15\u0e49\u0e2d\u0e07\u0e44\u0e14\u0e49\u0e04\u0e48\u0e32\u0e15\u0e23\u0e07\u0e01\u0e31\u0e1a golden-section \u0e20\u0e32\u0e22\u0e43\u0e19 1e-4 | \u0e43\u0e0a\u0e49\u0e2a\u0e2d\u0e07\u0e27\u0e34\u0e18\u0e35\u0e22\u0e37\u0e19\u0e22\u0e31\u0e19\u0e01\u0e31\u0e19 |\n| \u0e40\u0e23\u0e35\u0e22\u0e07\u0e2d\u0e31\u0e19\u0e14\u0e31\u0e1a / feed | greedy (MMR) $O(k\\cdot n)$ | n \u2264 200 SKU, k \u2264 20 |\n\n### 5.5 \u0e01\u0e23\u0e13\u0e35\u0e02\u0e2d\u0e1a\u0e41\u0e25\u0e30\u0e01\u0e32\u0e23\u0e08\u0e31\u0e14\u0e01\u0e32\u0e23\u0e04\u0e27\u0e32\u0e21\u0e1c\u0e34\u0e14\u0e1e\u0e25\u0e32\u0e14\n\n| \u0e01\u0e23\u0e13\u0e35 | \u0e17\u0e33\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e44\u0e23 |\n|---|---|\n| \u0e15\u0e30\u0e01\u0e23\u0e49\u0e32\u0e27\u0e48\u0e32\u0e07 | \u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e40\u0e2a\u0e19\u0e2d, \u0e2a\u0e48\u0e27\u0e19\u0e15\u0e48\u0e32\u0e07\u0e16\u0e36\u let src = MD.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => { MATH.push({t, d: true}); return '@@M' + (MATH.length - 1) + '@@'; });
src = src.replace(/(?<![\\$])\$(?![\s$])([^$\n]+?)(?<![\s\\])\$/g, (m, t) => { MATH.push({t, d: false}); return '@@M' + (MATH.length - 1) + '@@'; });
el.innerHTML = marked.parse(src).replace(/@@M(\d+)@@/g, (m, i) => '<span class="math" data-i="' + i + '"></span>');
el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
el.querySelectorAll('pre > code.language-mermaid').forEach(c => {
  const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent; c.parentElement.replaceWith(d);
});
let mathErrors = 0;
el.querySelectorAll('span.math').forEach(sp => { const m = MATH[+sp.dataset.i]; try { katex.render(m.t, sp, {displayMode: m.d, throwOnError: true}); } catch (e) { mathErrors++; sp.textContent = m.t; console.error(e); } });
window.__mathCount = MATH.length; window.__mathErrors = mathErrors;
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict', flowchart: { htmlLabels: true, useMaxWidth: true }, themeVariables: { fontFamily: 'IBM Plex Sans Thai, sans-serif' } });
mermaid.run({ querySelector: '.mermaid' }).then(() => { window.__mermaidDone = true; }).catch(e => { window.__mermaidError = String(e); console.error(e); });
</script>
</body>
</html>
